name: La Botaniste Rebelle — mise à jour Firebase

on:
  # Toutes les 20 min (SEGMENT_MS = 50s, mais on veut garder lastSeen
  # frais pour le seuil ONLINE_THRESHOLD_MS = 30s).
  # On relance toutes les 20 min = 1200s, largement dans les 30s de
  # tolérance (le script met à jour lastSeen à chaque run).
  schedule:
    - cron: '*/20 * * * *'
  # Permet aussi de déclencher manuellement depuis l'onglet Actions
  workflow_dispatch:

jobs:
  update:
    name: Mise à jour position Botaniste
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run botaniste script
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: node scripts/botaniste.js
